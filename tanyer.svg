<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="c1">
  <title id="c1">Az egészséges tányér modell: fele zöldség és gyümölcs, negyede teljes értékű gabona, negyede fehérje</title>
  <rect width="520" height="420" fill="#F5F8F6"/>
  <g transform="translate(260,190)">
    <circle r="152" fill="#ffffff" stroke="#D8E5DE" stroke-width="3"/>
    <!-- fele: zöldség + gyümölcs -->
    <path d="M0,0 L0,-140 A140,140 0 0,0 0,140 Z" fill="#1F7A5C"/>
    <path d="M0,0 L0,-140 A140,140 0 0,0 -140,0 Z" fill="#2E8F6C"/>
    <!-- negyed: gabona -->
    <path d="M0,0 L0,-140 A140,140 0 0,1 140,0 Z" fill="#E9A83F"/>
    <!-- negyed: fehérje -->
    <path d="M0,0 L140,0 A140,140 0 0,1 0,140 Z" fill="#C4694E"/>
    <circle r="34" fill="#ffffff"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#14503B">TÁNYÉR</text>
    <text x="0" y="15" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="10" fill="#5F6F68">modell</text>

    <text x="-72" y="-58" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ffffff">ZÖLDSÉG</text>
    <text x="-72" y="-40" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="12" fill="#D6EDE2">25%</text>
    <text x="-72" y="58" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ffffff">GYÜMÖLCS</text>
    <text x="-72" y="76" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="12" fill="#D6EDE2">25%</text>
    <text x="72" y="-52" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#4A2E08">GABONA</text>
    <text x="72" y="-34" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="12" fill="#6B4712">25%</text>
    <text x="72" y="52" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ffffff">FEHÉRJE</text>
    <text x="72" y="70" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="12" fill="#F6DCD4">25%</text>
  </g>
  <g transform="translate(30,378)">
    <circle cx="8" cy="-4" r="7" fill="#1F7A5C"/>
    <text x="24" y="0" font-family="Karla, Segoe UI, sans-serif" font-size="13" fill="#16241F">A tányér fele zöldség és gyümölcs — ez a legfontosabb szabály.</text>
  </g>
</svg>
